        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const q = allQuizData[currentQuestion];
            document.getElementById('question-number').innerText = `السؤال ${currentQuestion + 1} من ${allQuizData.length}`;
            document.getElementById('lecture-source').innerText = `المصدر: ${q.source}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('hint-box').innerText = `💡 تلميح: ${q.hint}`;
            
            const progress = ((currentQuestion) / allQuizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('score-tracker').innerText = `النتيجة الحالية: ${score} من ${allQuizData.length}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-right p-4 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-indigo-500 hover:bg-slate-700/60 transition font-medium text-slate-200 cursor-pointer flex items-center justify-between";
                btn.innerHTML = `<span>${opt.text}</span><span class="w-7 h-7 rounded-full border border-slate-600 bg-slate-900 flex items-center justify-center text-xs text-slate-400 font-bold">${String.fromCharCode(65 + index)}</span>`;
                btn.onclick = () => selectOption(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function toggleHint() {
            document.getElementById('hint-box').classList.toggle('hidden');
        }

        function selectOption(selectedOpt, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = allQuizData[currentQuestion];
            const buttons = document.getElementById('options-container').children;

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                const optData = q.options[i];
                if (optData.isCorrect) {
                    buttons[i].className = "w-full text-right p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 text-emerald-200 font-bold flex items-center justify-between";
                } else if (buttons[i] === selectedBtn) {
                    buttons[i].className = "w-full text-right p-4 rounded-xl border-2 border-rose-500 bg-rose-950/40 text-rose-200 font-bold flex items-center justify-between";
                }
            }

            if (selectedOpt.isCorrect) {
                score++;
            }

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('hidden');
            if (selectedOpt.isCorrect) {
                expBox.className = "mb-6 p-4 rounded-xl text-sm border bg-emerald-950/50 border-emerald-700 text-emerald-200 leading-relaxed";
                expBox.innerHTML = `<strong>إجابة صحيحة! 🎉</strong><br>${selectedOpt.rationale}`;
            } else {
                expBox.className = "mb-6 p-4 rounded-xl text-sm border bg-rose-950/50 border-rose-700 text-rose-200 leading-relaxed";
                expBox.innerHTML = `<strong>إجابة غير صحيحة ❌</strong><br>${selectedOpt.rationale}`;
            }

            document.getElementById('score-tracker').innerText = `النتيجة الحالية: ${score} من ${allQuizData.length}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < allQuizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            const resScreen = document.getElementById('result-screen');
            resScreen.classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            
            const percentage = Math.round((score / allQuizData.length) * 100);
            document.getElementById('score-text').innerText = `لقد أتممت الاختبار الشامل بنجاح بنتيجة ${score} من أصل ${allQuizData.length} سؤالاً (${percentage}%)`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
